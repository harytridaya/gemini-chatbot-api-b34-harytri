<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini AI Chatbot - Travel Assistant</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Markdown Parser (marked) & Sanitizer (DOMPurify) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="chat-header">
      <div class="avatar-wrapper">
        <div class="header-avatar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
        </div>
        <span class="status-pulse"></span>
      </div>
      <div class="header-info">
        <h1>Triva Travel AI</h1>
        <div class="status-text">
          <span class="status-dot"></span>
          <span>Online • Siap membantu rencana liburanmu</span>
        </div>
      </div>
    </header>

    <!-- Chat Box -->
    <div id="chat-box" class="chat-box">
      <div class="message bot">
        <p>Halo! 👋 Saya <strong>Triva</strong>, travel assistant pribadi Anda. Mau merencanakan liburan ke mana dan untuk berapa lama? Anda juga bisa mengirim foto tempat wisata atau tiket untuk saya bantu analisis!</p>
      </div>
    </div>

    <!-- Image Preview Area -->
    <div id="image-preview-container" class="image-preview-container hidden">
      <div class="preview-card">
        <img id="preview-image" src="" alt="Preview Gambar" />
        <button type="button" id="remove-image-btn" aria-label="Hapus gambar">✕</button>
      </div>
    </div>

    <!-- Input Form -->
    <form id="chat-form">
      <input type="file" id="image-input" accept="image/*" style="display: none;" />
      
      <button type="button" id="attach-btn" title="Kirim Gambar / Foto" aria-label="Unggah Gambar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
          <circle cx="9" cy="9" r="2"/>
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
        </svg>
      </button>

      <input 
        type="text" 
        id="user-input" 
        placeholder="Tanyakan rencana liburanmu atau kirim gambar..." 
        autocomplete="off" 
      />

      <button type="submit" id="send-btn" aria-label="Kirim Pesan">
        <span>Send</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
